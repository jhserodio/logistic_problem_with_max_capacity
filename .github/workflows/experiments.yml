name: Parte F - Experimentos computacionais
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/lib.rs"
      - "src/bin/experiment.rs"
      - "scripts/parte_f.py"
      - "scripts/localize_results.py"
      - "scripts/validate_research.py"
      - ".github/workflows/experiments.yml"
permissions:
  contents: write
concurrency:
  group: parte-f-cvrp
  cancel-in-progress: true
jobs:
  experiments:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Testar Rust
        run: cargo test --all-targets
      - name: Compilar modo release
        run: cargo build --release --bin experiment
      - name: Medir e gerar CSV e graficos SVG
        run: python3 scripts/parte_f.py --timeout 55 --seed 7
      - name: Sincronizar documentos em ingles
        run: python3 scripts/localize_results.py
      - name: Validar links e arquivos bilingues
        run: python3 scripts/validate_research.py
      - name: Arquivar relatorio e dados
        uses: actions/upload-artifact@v4
        with:
          name: cvrp-parte-f
          path: |
            research/ptBr/
            research/enUs/
      - name: Publicar resumo
        run: cat research/ptBr/experimentos.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar os resultados medidos no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/ptBr/experimentos.md research/ptBr/results/ research/ptBr/img/ research/enUs/experiments.md research/enUs/results/ research/enUs/img/
          if git diff --cached --quiet; then
            echo "Sem alteracoes."
          else
            git commit -m "docs: resultados medidos da Parte F [skip ci]"
            git push origin HEAD:master
          fi
